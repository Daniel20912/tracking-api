spring.application.name=tracking

# database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3

# hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# external api
config.api.url=${API_URL}
config.api.key=${API_KEY}

# frontend cors
cors.allowed-origins=https://daniel20912.github.io

# email
brevo.api.url=https://api.brevo.com/v3
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=Tracking API

# scheduler
scheduler.interval=86400000